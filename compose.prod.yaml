# Production stack. Caddy serves the built frontend, proxies /api and /ws, and
# obtains TLS certificates automatically when SITE_ADDRESS is a real domain.
#
#   local test:  docker compose -f compose.prod.yaml up --build -d
#   deployment:  SITE_ADDRESS=gesture.example.com ACME_EMAIL=you@example.com \
#                docker compose -f compose.prod.yaml up --build -d
name: gesture-vision

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gesture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gesture_db}
    volumes:
      - gesture_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gesture}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the API reaches the database, over the internal network.

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gesture}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gesture_db}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-2.0}"
          memory: ${API_MEMORY_LIMIT:-2G}

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Certificates must survive restarts, otherwise every restart requests new
      # ones and runs into Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  gesture_db_data:
  caddy_data:
  caddy_config:
