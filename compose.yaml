# Development stack: http://localhost:3000 serves the app, the API and the
# WebSocket through one origin, so the browser behaves exactly as in production.
#
#   docker compose up --build
#
# Lives in the repository root so Compose picks up .env automatically.
name: gesture-vision-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gesture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gesture_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gesture_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gesture}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gesture}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gesture_db}
    volumes:
      - ./app:/srv/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/srv/app"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DEV_API_TARGET: http://api:8000
    volumes:
      - ./client_frontend/src:/app/client_frontend/src:ro
      - ./client_frontend/public:/app/client_frontend/public:ro

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  gesture_db_data:
